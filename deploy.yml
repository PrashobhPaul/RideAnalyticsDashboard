name: Build analytics & deploy to Pages

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "site/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analytics dependencies
        run: pip install pandas numpy circlify

      - name: Run Python analytics engine
        run: python scripts/build_analytics.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/* _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
